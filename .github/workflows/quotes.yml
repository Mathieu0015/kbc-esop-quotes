# .github/workflows/quotes.yml
#
# Rafraichit chaque soir le JSON des cours KBC ESOP (un fichier par produit)
# et le commite. Portfolio Performance lit ensuite chaque fichier via son URL raw.
#
# Prerequis : Settings > Secrets and variables > Actions > New repository secret
#   Nom    : KBC_URLS
#   Valeur : une ligne par produit, au format  nom=url
#
#            bestof-eunl-2026-03-31=https://option.esop.kbc.be/flat.php?enc=AAA
#            top-warrant-2025-06-30=https://warrant.esop.kbc.be/flat.php?enc=BBB

name: KBC ESOP quotes

on:
  schedule:
    # 19h00 UTC du lundi au vendredi (21h en Belgique l'ete, 20h l'hiver)
    - cron: "0 19 * * 1-5"
  workflow_dispatch: {}          # permet aussi le lancement manuel

permissions:
  contents: write

concurrency:
  group: kbc-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les cours
        env:
          KBC_URLS: ${{ secrets.KBC_URLS }}
        run: python3 kbc_to_json.py quotes

      - name: Commiter si changement
        if: always()             # commite les produits qui ont reussi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes/
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "cours: $(date -u +%Y-%m-%d)"
            git push
          fi
